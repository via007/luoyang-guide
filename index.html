<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>洛阳 · 神都行 | 国庆双人游</title>
<meta name="description" content="洛阳国庆五天双人游攻略：行程、路线、景区、美食、交通、备忘清单。">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6e211c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a0a09" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="神都行">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div>
        <h1 id="heroTitle"></h1>
        <div class="sub" id="heroSub"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div class="seal" id="heroSeal"></div>
        <button class="themebtn" id="themeBtn" type="button" title="切换深浅色" aria-label="切换深浅色">🌙</button>
      </div>
    </div>
    <div class="hero-meta" id="heroMeta"></div>
    <div class="countdown" id="cd"></div>
    <div class="syncbar" id="syncBar"><span class="dot"></span><span id="syncText">本机保存</span></div>
  </div>
  <svg class="wave" viewBox="0 0 680 34" preserveAspectRatio="none"><path d="M0,34 L0,22 C85,8 170,30 255,20 C340,10 425,28 510,18 C570,11 625,20 680,14 L680,34 Z"/></svg>
</header>

<main>

  <!-- ================= 总览 ================= -->
  <section class="tabpage active" id="p-home">
    <div class="sec">抵达车次（10月1日）</div>
    <div id="trains"></div>
    <div id="arrivalNotice"></div>

    <div class="sec">国庆天气</div>
    <div class="card">
      <div class="weathergrid" id="weather"></div>
      <div class="btnrow" id="weatherBtns"></div>
    </div>

    <div class="sec">五天概览</div>
    <div class="card" style="padding:8px 0 4px">
      <table class="ptable bare" style="border:none"><tbody id="overview"></tbody></table>
    </div>

    <div class="sec">预约时间线</div>
    <div class="notice danger" id="bookingTimeline" style="font-size:13px;line-height:2"></div>
  </section>

  <!-- ================= 行程 ================= -->
  <section class="tabpage" id="p-plan">
    <div class="daypills" id="dayPills"></div>
    <div id="dayList"></div>
  </section>

  <!-- ================= 路线 ================= -->
  <section class="tabpage" id="p-route">
    <div class="sec">真实地图 · 可缩放拖动</div>
    <div class="card" style="padding:12px">
      <div id="amapBox"></div>
      <div id="amapForm">
        <p class="map-help" id="amapHelp"></p>
        <input class="aki" id="akKey" placeholder="粘贴 Key" autocomplete="off">
        <input class="aki" id="akSec" placeholder="粘贴 安全密钥（securityJsCode）" autocomplete="off">
        <button class="rbtn" id="akSave" type="button">保存并加载地图</button>
        <p id="akMsg"></p>
        <button class="maplink" id="akReset" type="button" style="display:none">清除本机 Key</button>
      </div>
      <div class="rlegend" id="alegend" style="display:none"></div>
    </div>

    <div class="sec">每天怎么走（距离 + 公交地铁）</div>
    <div id="legsByDay"></div>

    <div class="sec">自定义连线（可编辑）</div>
    <div class="card" style="padding:10px">
      <svg id="rmap" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" aria-label="可编辑路线图"></svg>
      <div class="rlegend" id="rlegend"></div>
      <div id="rsel"></div>
      <div class="rtools">
        <button id="btnAdd" type="button">＋ 加节点</button>
        <button id="btnRename" type="button">改名</button>
        <button id="btnDelEdge" type="button">断开连线</button>
        <button id="btnDelNode" type="button" class="warn">删节点</button>
        <button id="btnClear" type="button" class="warn">清空全部</button>
        <button id="btnReset" type="button">恢复默认</button>
      </div>
      <p id="rhint">
        <b>拖动</b>节点调整位置 · <b>点一下</b>选中节点，<b>再点另一个</b>就连线（箭头=先后顺序）· 选中后可用上方按钮改名/断开/删除 · 改动自动保存并同步
      </p>
    </div>
  </section>

  <!-- ================= 景区 ================= -->
  <section class="tabpage" id="p-sight"><div id="sights"></div></section>

  <!-- ================= 美食 ================= -->
  <section class="tabpage" id="p-food">
    <div class="notice" id="foodNotice" style="font-size:13px"></div>
    <div id="foods"></div>
    <div class="card" id="souvenir"></div>
  </section>

  <!-- ================= 交通 ================= -->
  <section class="tabpage" id="p-trans">
    <div class="sec">高铁</div>
    <div class="card" style="padding:8px 0 4px">
      <table class="ptable bare" style="border:none"><tbody id="trainRows"></tbody></table>
      <p class="muted" id="trainNote" style="padding:8px 10px 4px"></p>
    </div>

    <div class="sec">市内交通</div>
    <div class="card" id="intraCity"></div>

    <div class="sec">一键导航（点击跳高德）</div>
    <div class="card" style="padding:8px 14px" id="navlines"></div>
  </section>

  <!-- ================= 备忘 ================= -->
  <section class="tabpage" id="p-memo">
    <div class="sec">预约与购票清单</div>
    <div class="card">
      <div id="checkBooking"></div>
      <div class="progress"><i id="pbBooking"></i></div>
      <div class="progress-label" id="plBooking"></div>
    </div>

    <div class="sec">携带物品</div>
    <div class="card">
      <div id="checkPacking"></div>
      <div class="progress"><i id="pbPacking"></i></div>
      <div class="progress-label" id="plPacking"></div>
    </div>

    <div class="sec">注意事项</div>
    <div class="card" id="memoNotes"></div>
  </section>

</main>

<nav id="nav">
  <button class="on" data-p="p-home" type="button"><span class="ic">🏠</span>总览</button>
  <button data-p="p-plan" type="button"><span class="ic">🗓️</span>行程</button>
  <button data-p="p-route" type="button"><span class="ic">🗺️</span>路线</button>
  <button data-p="p-sight" type="button"><span class="ic">⛩️</span>景区</button>
  <button data-p="p-food" type="button"><span class="ic">🍜</span>美食</button>
  <button data-p="p-trans" type="button"><span class="ic">🚄</span>交通</button>
  <button data-p="p-memo" type="button"><span class="ic">✅</span>备忘</button>
</nav>

<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
