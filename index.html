<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <meta name="description" content="2026 国庆洛阳·开封双人行：每天怎么走、六段车次、住宿与预约。">
  <title>洛阳 · 开封｜国庆行程</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" as="image" href="art/luoyang-tang.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div>
          <div class="hero-kicker">二〇二六 · 国庆双城行</div>
          <h1 id="heroTitle"></h1>
          <div class="sub" id="heroSub"></div>
        </div>
        <button class="themebtn" id="themeBtn" type="button" title="切换深浅色" aria-label="切换深浅色">◐</button>
      </div>
      <div class="hero-meta" id="heroMeta"></div>
      <div class="hero-foot"><div class="countdown" id="cd"></div><div class="syncbar" id="syncBar"><span class="dot"></span><span id="syncText">本机保存</span></div></div>
    </div>
  </header>

  <main>
    <section class="tabpage active" id="p-home" aria-label="概览">
      <div class="section-label"><span>01 / 出行概览</span><span>先看关键时间</span></div>
      <div class="focus-card" id="nextMove"></div>
      <div class="sec">一程双城</div>
      <div class="city-gallery">
        <figure class="city-scene tang-scene">
          <img src="art/yingtian-tang.jpg" alt="唐风应天门夜景主题插画" loading="lazy">
          <figcaption><small>10/1 — 10/3 · 大唐神都</small><strong>洛阳</strong><span>龙门石窟 · 应天门</span></figcaption>
        </figure>
        <figure class="city-scene song-scene">
          <img src="art/kaifeng-song.jpg" alt="宋风汴京桥与市井主题插画" loading="lazy">
          <figcaption><small>10/4 — 10/6 · 大宋东京</small><strong>开封</strong><span>清明上河园 · 古城</span></figcaption>
        </figure>
      </div>
      <div class="sec">六天安排</div>
      <div class="overview-list" id="overview"></div>
      <p class="home-hint">具体时刻和站名见「车票」，当天细节见「每日」。</p>
    </section>

    <section class="tabpage" id="p-plan" aria-label="每日行程">
      <div class="section-label"><span>02 / 每日行程</span><span>一次只看一天</span></div>
      <div class="daypills" id="dayPills"></div>
      <div id="dayList"></div>
    </section>

    <section class="tabpage" id="p-trans" aria-label="车票">
      <div class="section-label"><span>03 / 车票时刻</span><span>以订单为准</span></div>
      <div id="trainRows"></div>
      <div class="notice danger" id="trainNote"></div>
      <details class="resource-group"><summary><span>市内交通</span><span class="arrow">＋</span></summary><div class="detail-body" id="intraCity"></div></details>
      <details class="resource-group"><summary><span>一键导航</span><span class="arrow">＋</span></summary><div class="detail-body" id="navlines"></div></details>
    </section>

    <section class="tabpage" id="p-route" aria-label="地图">
      <div class="section-label"><span>04 / 路线地图</span><span>按城市查看</span></div>
      <div class="notice" id="routeTransfer"></div>
      <p class="map-caveat">住宿点按截图地址标在地图上；部分标记是附近位置。到店时点击标记，用酒店名称与完整地址导航。</p>
      <div class="card map-card"><div class="maphead"><b>洛阳</b><span>10/1 — 10/3</span></div><div class="amapbox" id="amapBox_ly"></div><p class="amapmsg" id="amapMsg_ly"></p><div class="amapfilter" id="amapFilter_ly"></div><div class="rlegend" id="alegend_ly"></div></div>
      <div class="card map-card"><div class="maphead"><b>开封</b><span>10/4 — 10/5</span></div><div class="amapbox" id="amapBox_kf"></div><p class="amapmsg" id="amapMsg_kf"></p><div class="amapfilter" id="amapFilter_kf"></div><div class="rlegend" id="alegend_kf"></div></div>
    </section>

    <section class="tabpage" id="p-more" aria-label="资料">
      <div class="section-label"><span>05 / 行前资料</span><span>需要时再展开</span></div>
      <details class="resource-group"><summary><span>住宿 <small>4 处</small></span><span class="arrow">＋</span></summary><div class="resource-content" id="stays"></div></details>
      <details class="resource-group"><summary><span>预约与待办</span><span class="arrow">＋</span></summary><div class="resource-content"><div id="bookingTimeline" class="booking-list"></div><div id="checkBooking"></div><div class="progress"><i id="pbBooking"></i></div><div class="progress-label" id="plBooking"></div></div></details>
      <details class="resource-group"><summary><span>景点速查</span><span class="arrow">＋</span></summary><div class="resource-content" id="sights"></div></details>
      <details class="resource-group"><summary><span>美食与手信</span><span class="arrow">＋</span></summary><div class="resource-content"><p class="muted" id="foodNotice"></p><div id="foods"></div><div class="card" id="souvenir"></div></div></details>
      <details class="resource-group"><summary><span>天气与行李</span><span class="arrow">＋</span></summary><div class="resource-content"><div class="weathergrid" id="weather"></div><div class="btnrow" id="weatherBtns"></div><div class="sec">携带物品</div><div id="checkPacking"></div><div class="progress"><i id="pbPacking"></i></div><div class="progress-label" id="plPacking"></div><div class="sec">注意事项</div><div id="memoNotes"></div></div></details>
    </section>
  </main>

  <nav id="nav" aria-label="主导航">
    <button class="on" data-p="p-home" type="button"><span class="ic">◉</span>概览</button>
    <button data-p="p-plan" type="button"><span class="ic">▤</span>每日</button>
    <button data-p="p-trans" type="button"><span class="ic">⇢</span>车票</button>
    <button data-p="p-route" type="button"><span class="ic">◇</span>地图</button>
    <button data-p="p-more" type="button"><span class="ic">≡</span>资料</button>
  </nav>
  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
